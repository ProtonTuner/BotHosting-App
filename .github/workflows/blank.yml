name: Build Vesper Runtime APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: '17'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_PLATFORM: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_VERSION: '8.9'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install ZIP utilities
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract Vesper Runtime project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f \
            -iname '*.zip' \
            -not -path './.git/*' \
            | grep -Ei 'vesper|bothost|runtime' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró ningún ZIP del proyecto Vesper."
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE"

          mkdir -p "$RUNNER_TEMP/vesper-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vesper-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/vesper-source" \
            -type f \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::El ZIP no contiene settings.gradle."
            find "$RUNNER_TEMP/vesper-source" \
              -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"

          export GRADLE_USER_HOME="$RUNNER_TEMP/gradle-home"
          mkdir -p "$GRADLE_USER_HOME"

          LOG_FILE="$RUNNER_TEMP/gradle-build.log"
          : > "$LOG_FILE"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug 2>&1 | tee "$LOG_FILE"
          else
            gradle --no-daemon assembleDebug 2>&1 | tee "$LOG_FILE"
          fi

          STATUS=${PIPESTATUS[0]}
          echo "GRADLE_EXIT_CODE=$STATUS" >> "$GITHUB_ENV"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Gradle build failed. Logs preserved at $LOG_FILE"
            tail -n 200 "$LOG_FILE" || true
          fi

          exit "$STATUS"

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/apk-output"

          if [ -n "${PROJECT_DIR:-}" ] && [ -d "$PROJECT_DIR" ]; then
            find "$PROJECT_DIR" -type f -name '*.apk' \
              -path '*/build/outputs/apk/*' \
              -exec cp {} "$RUNNER_TEMP/apk-output/" \; 2>/dev/null
          fi

          if ! find "$RUNNER_TEMP/apk-output" -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::warning::No se generó ningún APK. Esto puede deberse a un fallo de compilación."
            ls -la "$RUNNER_TEMP" || true
          else
            echo "APK generated:"
            ls -lh "$RUNNER_TEMP/apk-output"
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vesper-runtime-debug-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Always finish and show build log
        if: always()
        shell: bash
        run: |
          echo "Final workflow status: ${{ job.status }}"
          if [ -f "$RUNNER_TEMP/gradle-build.log" ]; then
            echo "---- Gradle build log (tail) ----"
            tail -n 200 "$RUNNER_TEMP/gradle-build.log" || true
          fi
