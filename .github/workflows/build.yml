name: Build APK (todo en uno)

# Compila TODO en una sola ejecución: librerías de música (davey, libopus, ffmpeg) + APK,
# y publica el APK en Releases. Detecta solo en qué carpeta está el proyecto.
on:
  push:
  workflow_dispatch:
    inputs:
      music:
        description: "Incluir música (davey + libopus + ffmpeg)"
        type: boolean
        default: true

permissions:
  contents: write   # necesario para crear el Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MUSIC: ${{ github.event.inputs.music != 'false' }}
    steps:
      - uses: actions/checkout@v4

      # Busca la carpeta que contiene settings.gradle + app/ (raíz, subcarpeta o dentro de un .zip).
      - name: Detectar carpeta del proyecto
        run: |
          buscar() {
            find . -maxdepth 5 -name settings.gradle -not -path './.git/*' | while read f; do
              d=$(dirname "$f"); [ -d "$d/app" ] && echo "$d" && break
            done
          }
          SG=$(buscar)
          if [ -z "$SG" ]; then
            echo "No hay proyecto suelto; busco .zip en el repo..."
            find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | while read z; do
              echo "Descomprimiendo $z"
              mkdir -p "_unzipped/$(basename "$z" .zip)"
              unzip -qo "$z" -d "_unzipped/$(basename "$z" .zip)"
            done
            SG=$(buscar)
          fi
          if [ -z "$SG" ]; then
            echo "::error::No encontré settings.gradle junto a una carpeta app/. Archivos del repo:"
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          echo "Proyecto en: $SG"
          echo "PD=$SG" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # ---------- Keystore ----------
      # Con el secret KEYSTORE_BASE64 las actualizaciones se instalan encima de la versión anterior.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          cd "$PD"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          else
            keytool -genkeypair -keystore app/release.jks -storepass android -keypass android \
              -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BotHost"
          fi

      # ---------- Música (opcional) ----------
      - name: APK debug (para extraer libpython3.11.so)
        if: env.MUSIC == 'true'
        run: |
          cd "$PD"
          mkdir -p app/wheels
          rm -f app/wheels/*.whl
          gradle assembleDebug --no-daemon
          mkdir -p /tmp/pylib
          unzip -j app/build/outputs/apk/debug/*.apk 'lib/arm64-v8a/libpython3.11.so' -d /tmp/pylib

      - uses: dtolnay/rust-toolchain@stable
        if: env.MUSIC == 'true'
        with:
          targets: aarch64-linux-android

      - name: davey (Rust -> wheel Android)
        if: env.MUSIC == 'true'
        run: |
          cd "$PD"
          python3 tools/make_davey_wheel.py --pylib /tmp/pylib --out app/wheels

      - name: libopus (NDK + CMake)
        if: env.MUSIC == 'true'
        run: |
          cd "$PD"
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git /tmp/opus
          cmake -S /tmp/opus -B /tmp/opus-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-z,max-page-size=16384"
          cmake --build /tmp/opus-build -j"$(nproc)"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$(find /tmp/opus-build -name 'libopus.so*' -type f | head -1)" app/src/main/jniLibs/arm64-v8a/libopus.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-unneeded app/src/main/jniLibs/arm64-v8a/libopus.so

      - name: ffmpeg estático arm64
        if: env.MUSIC == 'true'
        run: |
          cd "$PD"
          pip download imageio-ffmpeg==0.6.0 --platform manylinux2014_aarch64 --only-binary=:all: --no-deps -d /tmp/iff
          unzip -qo /tmp/iff/*.whl -d /tmp/iff/x
          cp /tmp/iff/x/imageio_ffmpeg/binaries/ffmpeg-linux-aarch64-* app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          ls -la app/wheels app/src/main/jniLibs/arm64-v8a

      # ---------- APK final ----------
      # build.gradle detecta wheels/ y jniLibs/ y activa la música solo.
      - name: Compilar APK release
        run: |
          cd "$PD"
          gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BotHost-apk
          path: ${{ env.PD }}/app/build/outputs/apk/release/*.apk

      # ---------- Publicar en Releases ----------
      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$PD"/app/build/outputs/apk/release/*.apk BotHost.apk
          gh release create "build-${{ github.run_number }}" BotHost.apk \
            --title "BotHost build ${{ github.run_number }}" \
            --notes "Compilado desde $(git rev-parse --short HEAD). Música: $MUSIC" \
            --target "${{ github.sha }}"
