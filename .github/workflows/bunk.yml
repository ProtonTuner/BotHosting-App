name: Build Vesper Runtime APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_VERSION: '17'
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_PLATFORM: '35'
      ANDROID_BUILD_TOOLS: '35.0.0'
      GRADLE_VERSION: '8.9'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install ZIP utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract Vesper Runtime project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f \
            -iname 'vesper_runtime*.zip' \
            -not -path './.git/*' \
            -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No se encontró vesper_runtime*.zip"
            find . -type f -iname '*.zip' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/vesper-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/vesper-source"

          SETTINGS_FILE="$(find "$RUNNER_TEMP/vesper-source" \
            -type f \( -name 'settings.gradle' \
            -o -name 'settings.gradle.kts' \) \
            -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::El ZIP no contiene settings.gradle."
            find "$RUNNER_TEMP/vesper-source" \
              -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proyecto: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk-output"

          find "$PROJECT_DIR" -type f -name '*.apk' \
            -path '*/build/outputs/apk/*' \
            -exec cp {} "$RUNNER_TEMP/apk-output/" \;

          if ! find "$RUNNER_TEMP/apk-output" \
            -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::No se generó ningún APK."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/apk-output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vesper-runtime-debug-apk
          path: ${{ runner.temp }}/apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
