name: Vesper Light APK Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'
  pull_request:
    paths:
      - '**.zip'
      - '.github/workflows/android.yml'
      - 'app/**'
      - '*.gradle'
      - '*.gradle.kts'
      - 'settings.gradle'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

concurrency:
  group: vesper-light-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate source and compile APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Download repository files
        uses: actions/checkout@v7

      - name: Select Android project source
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd()
          preferred = repo / "vesper_light_launcher_source.zip"

          def project_in_zip(archive_path: Path) -> bool:
              try:
                  with zipfile.ZipFile(archive_path) as zf:
                      names = set()
                      for member in zf.infolist():
                          name = member.filename.replace("\\", "/").lstrip("./")
                          names.add(str(PurePosixPath(name)))
                      settings = [n for n in names if PurePosixPath(n).name in ("settings.gradle", "settings.gradle.kts")]
                      for setting in settings:
                          parent = PurePosixPath(setting).parent
                          build_candidates = [str(parent / "app" / "build.gradle"), str(parent / "app" / "build.gradle.kts")]
                          root_build = [str(parent / "build.gradle"), str(parent / "build.gradle.kts")]
                          manifest = str(parent / "app" / "src" / "main" / "AndroidManifest.xml")
                          if any(p in names for p in build_candidates) and any(p in names for p in root_build) and manifest in names:
                              return True
              except (OSError, zipfile.BadZipFile):
                  return False
              return False

          def project_in_repo() -> bool:
              root = repo
              settings = any((root / name).is_file() for name in ("settings.gradle", "settings.gradle.kts"))
              app_build = any((root / "app" / name).is_file() for name in ("build.gradle", "build.gradle.kts"))
              root_build = any((root / name).is_file() for name in ("build.gradle", "build.gradle.kts"))
              manifest = (root / "app" / "src" / "main" / "AndroidManifest.xml").is_file()
              return settings and app_build and root_build and manifest

          if preferred.exists():
              if not project_in_zip(preferred):
                  raise SystemExit("ERROR: vesper_light_launcher_source.zip existe, pero no contiene un proyecto Android válido (settings.gradle, app/build.gradle y AndroidManifest.xml deben pertenecer al mismo proyecto).")
              mode, source_path = "zip", preferred.name
          elif project_in_repo():
              mode, source_path = "repo", "."
          else:
              candidates = []
              for candidate in sorted(repo.glob("*.zip")):
                  if candidate.name.lower().startswith("logs"):
                      continue
                  if project_in_zip(candidate):
                      candidates.append(candidate)
              if len(candidates) == 1:
                  mode, source_path = "zip", candidates[0].name
              elif len(candidates) > 1:
                  names = ", ".join(p.name for p in candidates)
                  raise SystemExit(
                      "ERROR: hay varios ZIP que contienen proyectos Android: " + names +
                      ". Renombra el ZIP correcto a vesper_light_launcher_source.zip para evitar elegir la versión equivocada."
                  )
              else:
                  raise SystemExit(
                      "ERROR: no se encontró un proyecto Android. Sube vesper_light_launcher_source.zip a la raíz del repositorio, "
                      "o coloca directamente allí settings.gradle, build.gradle y app/."
                  )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"path={source_path}\n")
          print(f"Modo de fuente: {mode}; fuente: {source_path}")
          PY

      - name: Extract source ZIP safely
        if: steps.source.outputs.mode == 'zip'
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.path }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path = Path(os.environ["SOURCE_ZIP"])
          destination = Path("workspace").resolve()
          destination.mkdir(parents=True, exist_ok=True)
          maximum_uncompressed_bytes = 1024 * 1024 * 1024

          with zipfile.ZipFile(archive_path) as archive:
              bad_member = archive.testzip()
              if bad_member:
                  raise SystemExit(f"ERROR: el ZIP está dañado: {bad_member}")

              total = 0
              for member in archive.infolist():
                  name = member.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  if path.is_absolute() or ".." in path.parts or (path.parts and ":" in path.parts[0]):
                      raise SystemExit(f"ERROR: ruta insegura dentro del ZIP: {member.filename}")
                  mode = member.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      raise SystemExit(f"ERROR: no se aceptan enlaces simbólicos dentro del ZIP: {member.filename}")
                  total += member.file_size
                  if total > maximum_uncompressed_bytes:
                      raise SystemExit("ERROR: el ZIP supera el límite de extracción de 1 GiB.")
                  target = (destination / Path(*path.parts)).resolve()
                  try:
                      target.relative_to(destination)
                  except ValueError:
                      raise SystemExit(f"ERROR: ruta fuera del directorio de destino: {member.filename}")

              archive.extractall(destination)

          print(f"Fuente extraída correctamente en {destination}")
          PY

      - name: Locate and validate Android project
        id: project
        shell: bash
        env:
          SOURCE_MODE: ${{ steps.source.outputs.mode }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          if os.environ["SOURCE_MODE"] == "zip":
              search_root = Path("workspace").resolve()
          else:
              search_root = Path.cwd().resolve()

          valid = []
          for settings in list(search_root.rglob("settings.gradle")) + list(search_root.rglob("settings.gradle.kts")):
              project = settings.parent
              has_app_build = any((project / "app" / n).is_file() for n in ("build.gradle", "build.gradle.kts"))
              has_root_build = any((project / n).is_file() for n in ("build.gradle", "build.gradle.kts"))
              manifest = project / "app" / "src" / "main" / "AndroidManifest.xml"
              if has_app_build and has_root_build and manifest.is_file():
                  valid.append(project)

          # Keep only the shallowest valid Gradle root, avoiding duplicate nested copies.
          unique = sorted(set(valid), key=lambda p: (len(p.parts), str(p)))
          if not unique:
              raise SystemExit(
                  "ERROR: no se encontró un proyecto válido. Se requieren settings.gradle, build.gradle, "
                  "app/build.gradle y app/src/main/AndroidManifest.xml."
              )
          min_depth = len(unique[0].parts)
          shallowest = [p for p in unique if len(p.parts) == min_depth]
          if len(shallowest) != 1:
              raise SystemExit("ERROR: se encontraron varios proyectos Android candidatos en el mismo nivel: " + ", ".join(map(str, shallowest)))

          project = unique[0]
          relative = os.path.relpath(project, Path.cwd())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"dir={relative}\n")
          print(f"Proyecto Android validado: {project}")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (without obsolete tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          command -v sdkmanager
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          sdkmanager --list_installed

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          echo "Android SDK and Gradle are available."

      - name: Compile debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace --warning-mode all clean assembleDebug

      - name: Validate and package APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          APK="$(find "$APK_DIR" -maxdepth 2 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "ERROR: Gradle acabó sin producir un APK debug válido."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/VesperLight-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/VesperLight-debug.apk > dist/APK-METADATA.txt
          grep -q "package: name='com.vesper.launcher'" dist/APK-METADATA.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 dist/VesperLight-debug.apk
          sha256sum dist/VesperLight-debug.apk > dist/SHA256SUMS.txt
          {
            echo "App: Vesper Light Launcher"
            echo "Package: com.vesper.launcher"
            echo "Version: 1.0.0 (debug)"
            echo "Gradle: 8.7"
            echo "Java: 17"
            echo "Compile SDK: 35"
            echo "Commit: $GITHUB_SHA"
            echo "Build date UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "APK bytes: $(stat -c '%s' dist/VesperLight-debug.apk)"
          } > dist/BUILD-INFO.txt
          echo "APK compilado, identificado y validado."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: VesperLight-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Capture build diagnostics on failure
        if: failure()
        shell: bash
        run: |
          mkdir -p build-diagnostics
          {
            echo "Vesper Light build diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Date UTC: $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo
            java -version 2>&1 || true
            gradle --version 2>&1 || true
            sdkmanager --list_installed 2>&1 || true
            echo
            find . -maxdepth 5 -type f \( -name '*.log' -o -name 'output-metadata.json' \) -print 2>/dev/null || true
          } > build-diagnostics/diagnostics.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VesperLight-Build-Diagnostics
          path: build-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
