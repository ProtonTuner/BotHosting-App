name: Build Vesper Light Launcher

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Extract Android project archive
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "vesper_light_launcher_github_actions.zip" ]; then
            unzip -q "vesper_light_launcher_github_actions.zip" -d .
            echo "Archive extracted."
            find . -maxdepth 3 \( -name "gradlew" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head
          else
            echo "No project archive found in repo root."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Build and test
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find . -maxdepth 4 -name gradlew -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Gradle project directory."
            exit 1
          fi
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon clean testDebugUnitTest assembleDebug

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=$(find . -maxdepth 4 -name gradlew -printf '%h\n' | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find Gradle project directory."
            exit 1
          fi
          cd "$PROJECT_DIR"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/VesperLight-debug.apk
          cd dist
          sha256sum VesperLight-debug.apk > SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: vesper-light-apk
          path: |
            **/dist/VesperLight-debug.apk
            **/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: vesper-light-apk
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/VesperLight-debug.apk
            dist/SHA256SUMS.txt
