
name: Vesper Android APK Compiler

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find source ZIP
        id: source
        shell: bash
        run: |
          ZIP="vesper_light_launcher_source.zip"

          if [ ! -f "$ZIP" ]; then
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' \
              ! -name '*compiler*' | head -n 1)"
          fi

          if [ -z "$ZIP" ] || [ ! -f "$ZIP" ]; then
            echo "ERROR: No se encontró el ZIP del proyecto Android."
            echo "Sube el ZIP fuente a la raíz del repositorio."
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Fuente encontrada: $ZIP"

      - name: Extract Android project
        run: |
          python3 - <<'PY'
          import os
          import zipfile

          archive = os.environ.get("SOURCE_ZIP")
          if not archive:
              archive = "${{ steps.source.outputs.zip }}"

          destination = os.path.abspath("workspace")
          os.makedirs(destination, exist_ok=True)

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  if name.startswith("/") or ".." in name.split("/"):
                      raise SystemExit("Ruta insegura dentro del ZIP: " + name)
                  target = os.path.abspath(os.path.join(destination, name))
                  if os.path.commonpath([destination, target]) != destination:
                      raise SystemExit("Ruta fuera del proyecto")
              z.extractall(destination)

          print("ZIP extraído.")
          PY
        env:
          SOURCE_ZIP: ${{ steps.source.outputs.zip }}

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS="$(find workspace -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontró settings.gradle."
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          if [ ! -d "$DIR/app" ]; then
            echo "ERROR: No se encontró la carpeta app/."
            exit 1
          fi

          if [ ! -f "$DIR/build.gradle" ] && \
             [ ! -f "$DIR/build.gradle.kts" ]; then
            echo "ERROR: No se encontró el build.gradle raíz."
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto: $DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon --stacktrace clean assembleDebug

      - name: Collect APK
        shell: bash
        run: |
          APK="$(find "${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Gradle terminó sin producir un APK."
            exit 1
          fi

          mkdir -p dist
          cp "$APK" dist/VesperLight-debug.apk
          sha256sum dist/VesperLight-debug.apk \
            > dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VesperLight-APK
          path: dist/
          if-no-files-found: error
          retention-days: 14
